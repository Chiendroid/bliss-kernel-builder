name: Build Bliss Kernel with KernelSU Next

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            clang lld llvm make gcc g++ \
            bison flex libssl-dev libelf-dev bc \
            cpio kmod zlib1g-dev python3 xz-utils

      - name: Fetch Exact Gloria Kernel 6.1.112 (Commit d41d398d)
        run: |
          mkdir -p kernel_source
          cd kernel_source
          git init
          git remote add origin https://github.com/hmtheboy154/Darkmatter-kernel.git
          git fetch --depth 1 origin d41d398db683c6ab289dd57fc2dd02badd51b86d || git fetch --filter=blob:none origin d41d398db683c6ab289dd57fc2dd02badd51b86d
          git checkout --force FETCH_HEAD

      - name: Integrate KernelSU-Next
        run: |
          cd kernel_source
          # Remove legacy KernelSU symlinks if present
          rm -rf drivers/kernelsu KernelSU
          # Inject latest KernelSU Next (using branch next which contains linux/init.h fix)
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s -- next
          # Ensure linux/init.h is included in sulog.h
          if [ -f drivers/kernelsu/feature/sulog.h ]; then
            grep -q '<linux/init.h>' drivers/kernelsu/feature/sulog.h || sed -i '/linux\/types.h/a #include <linux/init.h>' drivers/kernelsu/feature/sulog.h
          fi

      - name: Apply Tablet Hardware Configuration
        run: |
          cd kernel_source
          if [ -f ../bliss_kernel.config ]; then
            cp -f ../bliss_kernel.config .config
            echo "[+] Applied extracted bliss_kernel.config successfully!"
          else
            make ARCH=x86_64 android-x86_64_defconfig
            echo "[+] Applied android-x86_64_defconfig!"
          fi
          # Ensure KernelSU Next configs are active
          scripts/config --enable CONFIG_KSU
          scripts/config --disable CONFIG_KSU_DEBUG
          scripts/config --enable CONFIG_OVERLAY_FS

      - name: Compile Linux Kernel (bzImage and Modules)
        run: |
          cd kernel_source
          make ARCH=x86_64 CC=clang LD=ld.lld LLVM=1 -j$(nproc) bzImage modules
          mkdir -p ../modules_out
          make ARCH=x86_64 INSTALL_MOD_PATH=../modules_out modules_install

      - name: Prepare Final Output
        run: |
          cp -f kernel_source/arch/x86/boot/bzImage ./kernel
          ls -lh ./kernel
          cd modules_out/lib/modules
          tar -czf ../../../modules.tar.gz .
          cd ../../..
          ls -lh ./modules.tar.gz

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bliss-kernel-6.1.112-ksu-next
          path: |
            kernel
            modules.tar.gz
          retention-days: 7
