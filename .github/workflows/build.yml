name: Build Bliss Kernel and Matching Modules

on:
  workflow_dispatch:

jobs:
  build:
    name: Build KernelSU Next kernel and modules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/google* /etc/apt/sources.list.d/*chrome*
          sudo apt-get update -qq || sudo apt-get update --fix-missing -qq || true
          sudo apt-get install -y -qq \
            clang-17 lld-17 llvm-17 make gcc g++ \
            bison flex libssl-dev libelf-dev bc \
            cpio kmod zlib1g-dev python3 xz-utils
          sudo ln -sf /usr/bin/clang-17 /usr/bin/clang
          sudo ln -sf /usr/bin/clang++-17 /usr/bin/clang++
          sudo ln -sf /usr/bin/ld.lld-17 /usr/bin/ld.lld
          sudo ln -sf /usr/bin/llvm-ar-17 /usr/bin/llvm-ar
          sudo ln -sf /usr/bin/llvm-nm-17 /usr/bin/llvm-nm
          sudo ln -sf /usr/bin/llvm-objcopy-17 /usr/bin/llvm-objcopy
          sudo ln -sf /usr/bin/llvm-objdump-17 /usr/bin/llvm-objdump
          sudo ln -sf /usr/bin/llvm-readelf-17 /usr/bin/llvm-readelf
          sudo ln -sf /usr/bin/llvm-strip-17 /usr/bin/llvm-strip
          clang --version
          ld.lld --version

      - name: Fetch the Gloria kernel source
        run: |
          git clone --depth 1 --branch gloria \
            https://github.com/hmtheboy154/Darkmatter-kernel.git kernel_source
          git -C kernel_source rev-parse HEAD

      - name: Integrate KernelSU Next
        run: |
          cd kernel_source
          rm -rf drivers/kernelsu KernelSU KernelSU-Next
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/dev/kernel/setup.sh" | bash -s -- dev
          if [ -f drivers/kernelsu/core/init.c ]; then
            sed -i 's/<asm\/cpufeature.h>/<asm\/cpufeatures.h>/' drivers/kernelsu/core/init.c
          fi

      - name: Configure tablet hardware
        run: |
          cd kernel_source
          sed -i 's/SYSCALL_HARDENING_ON;/SYSCALL_HARDENING_OFF;/g' arch/x86/kernel/cpu/common.c
          sed -i 's/^SUBLEVEL = .*/SUBLEVEL = 112/' Makefile
          sed -i 's/^EXTRAVERSION =.*/EXTRAVERSION =/' Makefile
          : > .scmversion

          if [ -f ../bliss_kernel.config ]; then
            cp -f ../bliss_kernel.config .config
          else
            make ARCH=x86_64 CC=clang LD=ld.lld LLVM=1 android-x86_64_defconfig
          fi

          scripts/config --enable CONFIG_KSU
          scripts/config --disable CONFIG_KSU_DEBUG
          scripts/config --disable CONFIG_KSU_X86_PATCH_SYSCALL_DISPATCHER
          scripts/config --enable CONFIG_OVERLAY_FS
          scripts/config --set-str CONFIG_LOCALVERSION "-gloria"

          # Keep modversion checks enabled. Kernel and modules are built from
          # this exact source tree and .config, so their ABI must match.
          scripts/config --enable CONFIG_MODVERSIONS
          scripts/config --enable CONFIG_ASM_MODVERSIONS

          scripts/config --enable CONFIG_DRM
          scripts/config --enable CONFIG_DRM_KMS_HELPER
          scripts/config --enable CONFIG_DRM_DISPLAY_HELPER
          scripts/config --enable CONFIG_DRM_DISPLAY_DP_HELPER
          scripts/config --enable CONFIG_DRM_DISPLAY_HDCP_HELPER
          scripts/config --enable CONFIG_DRM_DISPLAY_HDMI_HELPER
          scripts/config --enable CONFIG_DRM_TTM
          scripts/config --enable CONFIG_DRM_TTM_HELPER
          scripts/config --enable CONFIG_DRM_BUDDY
          scripts/config --enable CONFIG_DRM_SCHED
          scripts/config --enable CONFIG_DRM_I915
          scripts/config --enable CONFIG_DRM_I915_CAPTURE_ERROR
          scripts/config --enable CONFIG_DRM_I915_COMPRESS_ERROR
          scripts/config --enable CONFIG_DRM_I915_USERPTR

          scripts/config --enable CONFIG_I2C_DESIGNWARE_PCI
          scripts/config --enable CONFIG_MFD_INTEL_LPSS
          scripts/config --enable CONFIG_MFD_INTEL_LPSS_PCI
          scripts/config --enable CONFIG_MFD_INTEL_LPSS_ACPI
          scripts/config --enable CONFIG_I2C_HID_ACPI
          scripts/config --enable CONFIG_I2C_HID_CORE
          scripts/config --enable CONFIG_HID_MULTITOUCH
          scripts/config --enable CONFIG_HID_WACOM
          scripts/config --enable CONFIG_TOUCHSCREEN_WACOM_I2C
          scripts/config --enable CONFIG_TOUCHSCREEN_WACOM_W8001
          scripts/config --enable CONFIG_TOUCHSCREEN_GOODIX
          scripts/config --enable CONFIG_TOUCHSCREEN_ELAN
          scripts/config --enable CONFIG_TOUCHSCREEN_SILEAD
          scripts/config --enable CONFIG_INTEL_ISH_HID
          scripts/config --enable CONFIG_HID_SENSOR_HUB
          scripts/config --enable CONFIG_HID_SENSOR_ACCEL_3D
          scripts/config --enable CONFIG_HID_SENSOR_IIO_COMMON
          scripts/config --enable CONFIG_HID_SENSOR_IIO_TRIGGER
          scripts/config --enable CONFIG_HID_SENSOR_DEVICE_ROTATION

          make ARCH=x86_64 CC=clang LD=ld.lld LLVM=1 olddefconfig
          make ARCH=x86_64 CC=clang LD=ld.lld LLVM=1 prepare
          make -s ARCH=x86_64 kernelrelease | tee ../kernel-release.txt

      - name: Compile and package the matching pair
        run: |
          cd kernel_source
          make ARCH=x86_64 CC=clang LD=ld.lld LLVM=1 -j"$(nproc)" bzImage modules
          cp -f arch/x86/boot/bzImage ../kernel
          KERNEL_RELEASE=$(make -s ARCH=x86_64 kernelrelease)
          mkdir -p ../modules_out
          make ARCH=x86_64 INSTALL_MOD_PATH=../modules_out modules_install
          depmod -b ../modules_out "$KERNEL_RELEASE"
          test -d "../modules_out/lib/modules/$KERNEL_RELEASE"
          tar -C ../modules_out/lib/modules -czf ../modules.tar.gz "$KERNEL_RELEASE"
          {
            echo "kernel_release=$KERNEL_RELEASE"
            echo "kernel_source=$(git rev-parse HEAD)"
            echo "kernel_sha256=$(sha256sum ../kernel | awk '{print $1}')"
            echo "modules_sha256=$(sha256sum ../modules.tar.gz | awk '{print $1}')"
          } > ../build-info.txt
          ls -lh ../kernel ../modules.tar.gz ../build-info.txt

      - name: Upload matched kernel bundle
        uses: actions/upload-artifact@v4
        with:
          name: bliss-kernel-ksu-next-matched
          path: |
            kernel
            modules.tar.gz
            kernel-release.txt
            build-info.txt
          retention-days: 7
